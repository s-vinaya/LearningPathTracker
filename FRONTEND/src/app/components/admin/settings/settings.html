<app-sidebar></app-sidebar>
<div class="settings-container">
  <div class="header">
    <h1>Settings</h1>
    <p>Configure your learning platform</p>
  </div>

  <div class="settings-content">
    <div class="section">
      <h2>Platform Information</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Platform Name</label>
          <input type="text" [(ngModel)]="platformName" placeholder="LearnTrack">
        </div>
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" [(ngModel)]="companyName" placeholder="Your Company">
        </div>
      </div>
      <div class="form-group">
        <label>Platform Description</label>
        <textarea [(ngModel)]="platformDescription" rows="4" placeholder="A comprehensive learning management system for employee development"></textarea>
      </div>
    </div>

    <div class="section">
      <h2>Course Settings</h2>
      <div class="toggle-item">
        <div class="toggle-info">
          <h3>Auto-enroll new users</h3>
          <p>Automatically enroll new users in default courses</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" [(ngModel)]="autoEnroll">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <div class="toggle-info">
          <h3>Course completion certificates</h3>
          <p>Generate certificates upon course completion</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" [(ngModel)]="certificates">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button class="save-btn" (click)="saveSettings()" [disabled]="loading">{{ loading ? 'Saving...' : 'Save Changes' }}</button>
      <button class="cancel-btn" (click)="cancel()" [disabled]="loading">Cancel</button>
    </div>
  </div>
</div>
