<div class="auth-container">
  <div class="auth-card">
    <div class="auth-left">
      <div class="auth-image">
        <div class="image-overlay">
          <h2>Welcome Back!</h2>
          <p>Sign in to continue your learning journey</p>
        </div>
      </div>
    </div>
    
    <div class="auth-right">
      <div class="auth-header">
        <h1>{{ platformName }}</h1>
        <p>Sign in to continue</p>
      </div>
      
      <div class="auth-tabs">
        <button class="tab active">Login</button>
        <button class="tab" (click)="switchToRegister()">Register</button>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" 
                 (blur)="validateEmail()" (input)="validateEmail()" required>
          <span *ngIf="emailError" class="validation-error">{{ emailError }}</span>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" 
                 (blur)="validatePassword()" (input)="validatePassword()" required>
          <span *ngIf="passwordError" class="validation-error">{{ passwordError }}</span>
        </div>

        <div *ngIf="error" class="error-message">
          <span>⚠️ {{ error }}</span>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
        
        <div class="auth-links">
          <a (click)="forgotPassword()" style="cursor: pointer; color: #6366f1;">Forgot Password?</a>
          <span style="color: #718096;">•</span>
          <a (click)="switchToRegister()" style="cursor: pointer; color: #6366f1;">Create new account</a>
        </div>
      </form>
    </div>
  </div>
</div>
