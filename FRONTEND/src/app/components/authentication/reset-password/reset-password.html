<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>{{ platformName }}</h1>
      <p>Create new password</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
      </div>

      <div *ngIf="message" class="success-message">
        <span>✓ {{ message }}</span>
      </div>

      <div *ngIf="error" class="error-message">
        <span>⚠️ {{ error }}</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading || !token">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
  </div>
</div>
