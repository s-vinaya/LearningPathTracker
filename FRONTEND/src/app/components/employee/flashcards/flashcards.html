<app-employee-sidebar></app-employee-sidebar>

<div class="dashboard-container">
  <div class="header">
    <h1>Flashcards</h1>
  </div>

  <div class="content">
    <div *ngIf="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading flashcards...</p>
    </div>

    <div *ngIf="!loading && flashcards.length === 0" class="no-data">
      <i class="fas fa-layer-group"></i>
      <p>No flashcards available</p>
    </div>

    <div *ngIf="!loading && flashcards.length > 0" class="flashcard-container">
      <div class="card-counter">
        {{currentIndex + 1}} / {{flashcards.length}}
      </div>

      <div class="flashcard" [class.flipped]="flipped" (click)="flipCard()">
        <div class="card-front">
          <h2>{{currentCard?.question}}</h2>
          <p class="hint">Click to reveal answer</p>
        </div>
        <div class="card-back">
          <h2>{{currentCard?.answer}}</h2>
          <p class="hint">Click to see question</p>
        </div>
      </div>

      <div class="controls">
        <button (click)="prevCard()" [disabled]="currentIndex === 0" class="nav-btn">
          <i class="fas fa-chevron-left"></i> Previous
        </button>
        <button (click)="nextCard()" [disabled]="currentIndex === flashcards.length - 1" class="nav-btn">
          Next <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
