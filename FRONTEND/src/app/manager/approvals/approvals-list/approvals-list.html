<div class="approvals-container">
  <mat-card class="header-card">
    <mat-card-header>
      <mat-card-title>Approval Requests</mat-card-title>
      <mat-card-subtitle>Review and manage employee requests</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="filter-buttons">
        <button mat-raised-button [color]="selectedFilter === 'all' ? 'primary' : ''" (click)="onFilterChange('all')">All</button>
        <button mat-raised-button [color]="selectedFilter === 'pending' ? 'primary' : ''" (click)="onFilterChange('pending')">Pending</button>
        <button mat-raised-button [color]="selectedFilter === 'approved' ? 'primary' : ''" (click)="onFilterChange('approved')">Approved</button>
        <button mat-raised-button [color]="selectedFilter === 'rejected' ? 'primary' : ''" (click)="onFilterChange('rejected')">Rejected</button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="table-card">
    <div *ngIf="loading" class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="!loading && approvals.length === 0" class="no-data">
      <p>No {{ selectedFilter === 'all' ? '' : selectedFilter }} approvals found</p>
    </div>

    <table mat-table [dataSource]="approvals" *ngIf="!loading && approvals.length > 0">
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let approval">{{ getTypeLabel(approval.type) }}</td>
      </ng-container>

      <ng-container matColumnDef="employeeName">
        <th mat-header-cell *matHeaderCellDef>Employee</th>
        <td mat-cell *matCellDef="let approval">{{ approval.employeeName }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let approval">{{ approval.createdAt | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let approval">
          <mat-chip [class]="'status-' + approval.status.toLowerCase()">{{ approval.status }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let approval">
          <button mat-button color="primary" (click)="openDetails(approval)">View</button>
          <button mat-raised-button color="primary" (click)="approve(approval)" *ngIf="approval.status === 'Pending'">Approve</button>
          <button mat-raised-button color="warn" (click)="reject(approval)" *ngIf="approval.status === 'Pending'">Reject</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
